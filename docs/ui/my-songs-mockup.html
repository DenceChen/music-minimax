<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的作品 - Music MiniMax</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
    }

    /* Header */
    .header {
      padding: 20px 40px;
      background: rgba(15, 15, 22, 0.95);
      border-bottom: 1px solid rgba(139, 92, 246, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 22px;
      height: 22px;
      fill: white;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-links {
      display: flex;
      gap: 8px;
    }

    .nav-link {
      padding: 10px 18px;
      color: #9ca3af;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 10px;
      transition: all 0.15s ease;
    }

    .nav-link:hover {
      background: rgba(139, 92, 246, 0.1);
      color: #e5e7eb;
    }

    .nav-link.active {
      background: rgba(139, 92, 246, 0.15);
      color: #a78bfa;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: white;
      cursor: pointer;
    }

    /* Main Content */
    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px;
    }

    .page-header {
      margin-bottom: 40px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 700;
      color: #e5e7eb;
      margin-bottom: 8px;
    }

    .page-subtitle {
      font-size: 15px;
      color: #6b7280;
    }

    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: rgba(25, 25, 35, 0.8);
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.2s ease;
    }

    .stat-card:hover {
      border-color: rgba(139, 92, 246, 0.3);
      transform: translateY(-2px);
    }

    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .stat-icon.purple {
      background: rgba(139, 92, 246, 0.15);
    }

    .stat-icon.blue {
      background: rgba(59, 130, 246, 0.15);
    }

    .stat-icon.green {
      background: rgba(34, 197, 94, 0.15);
    }

    .stat-icon.orange {
      background: rgba(251, 146, 60, 0.15);
    }

    .stat-icon svg {
      width: 22px;
      height: 22px;
    }

    .stat-icon.purple svg { fill: #8b5cf6; }
    .stat-icon.blue svg { fill: #3b82f6; }
    .stat-icon.green svg { fill: #22c55e; }
    .stat-icon.orange svg { fill: #fb923c; }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #e5e7eb;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 13px;
      color: #6b7280;
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 18px;
      background: rgba(25, 25, 35, 0.8);
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 10px;
      color: #9ca3af;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .filter-btn:hover {
      border-color: rgba(139, 92, 246, 0.3);
      color: #e5e7eb;
    }

    .filter-btn.active {
      background: rgba(139, 92, 246, 0.15);
      border-color: rgba(139, 92, 246, 0.3);
      color: #a78bfa;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(25, 25, 35, 0.8);
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 10px;
      margin-left: auto;
    }

    .search-box svg {
      width: 18px;
      height: 18px;
      fill: #6b7280;
    }

    .search-box input {
      flex: 1;
      background: none;
      border: none;
      font-size: 14px;
      color: #e5e7eb;
      font-family: inherit;
    }

    .search-box input::placeholder {
      color: #6b7280;
    }

    .search-box input:focus {
      outline: none;
    }

    /* Songs Grid */
    .songs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .song-card {
      background: rgba(20, 20, 28, 0.9);
      border: 1px solid rgba(139, 92, 246, 0.12);
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .song-card:hover {
      border-color: rgba(139, 92, 246, 0.3);
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -15px rgba(139, 92, 246, 0.2);
    }

    .song-cover {
      height: 180px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(59, 130, 246, 0.2));
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .song-cover::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(ellipse 60% 40% at 30% 30%, rgba(255, 255, 255, 0.1), transparent),
        radial-gradient(ellipse 50% 30% at 70% 70%, rgba(139, 92, 246, 0.2), transparent);
      animation: coverPulse 4s ease-in-out infinite;
    }

    @keyframes coverPulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }

    .cover-icon {
      width: 64px;
      height: 64px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 1;
    }

    .cover-icon svg {
      width: 28px;
      height: 28px;
      fill: white;
      margin-left: 4px;
    }

    .song-status {
      position: absolute;
      top: 14px;
      right: 14px;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .song-status.done {
      background: rgba(34, 197, 94, 0.9);
      color: white;
    }

    .song-status.processing {
      background: rgba(251, 146, 60, 0.9);
      color: white;
    }

    .song-status.failed {
      background: rgba(239, 68, 68, 0.9);
      color: white;
    }

    .song-info {
      padding: 20px;
    }

    .song-title {
      font-size: 16px;
      font-weight: 600;
      color: #e5e7eb;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-prompt {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .song-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .song-date {
      font-size: 12px;
      color: #6b7280;
    }

    .song-actions {
      display: flex;
      gap: 8px;
    }

    .song-action-btn {
      width: 32px;
      height: 32px;
      background: rgba(139, 92, 246, 0.1);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .song-action-btn:hover {
      background: rgba(139, 92, 246, 0.2);
    }

    .song-action-btn svg {
      width: 14px;
      height: 14px;
      fill: #a78bfa;
    }

    .song-action-btn.delete:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    .song-action-btn.delete:hover svg {
      fill: #ef4444;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 80px 40px;
    }

    .empty-icon {
      width: 80px;
      height: 80px;
      background: rgba(139, 92, 246, 0.1);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .empty-icon svg {
      width: 36px;
      height: 36px;
      fill: #6b7280;
    }

    .empty-title {
      font-size: 20px;
      font-weight: 600;
      color: #e5e7eb;
      margin-bottom: 8px;
    }

    .empty-text {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
    }

    .create-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .create-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px -5px rgba(139, 92, 246, 0.4);
    }

    .create-btn svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.3);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(139, 92, 246, 0.5);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
      </div>
      <span class="logo-text">Music MiniMax</span>
    </div>

    <div class="nav-links">
      <a href="chat-mockup.html" class="nav-link">创作对话</a>
      <a href="my-songs-mockup.html" class="nav-link active">我的作品</a>
    </div>

    <div class="header-actions">
      <div class="user-avatar">音</div>
    </div>
  </div>

  <div class="main-content">
    <div class="page-header">
      <h1 class="page-title">我的作品</h1>
      <p class="page-subtitle">管理你创作的所有音乐作品</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon purple">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
        <div class="stat-value">12</div>
        <div class="stat-label">总作品数</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon green">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
        <div class="stat-value">10</div>
        <div class="stat-label">已完成</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon blue">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
        </div>
        <div class="stat-value">2</div>
        <div class="stat-label">制作中</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon orange">
          <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
        </div>
        <div class="stat-value">5/5</div>
        <div class="stat-label">今日剩余次数</div>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active">全部</button>
      <button class="filter-btn">已完成</button>
      <button class="filter-btn">制作中</button>
      <button class="filter-btn">失败</button>

      <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" placeholder="搜索作品...">
      </div>
    </div>

    <div class="songs-grid">
      <!-- Song Card 1 -->
      <div class="song-card">
        <div class="song-cover">
          <span class="song-status done">已完成</span>
          <div class="cover-icon">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="song-info">
          <h3 class="song-title">星空物语</h3>
          <p class="song-prompt">创作一首关于星空的歌曲，要温柔治愈的风格</p>
          <div class="song-meta">
            <span class="song-date">2024年5月9日</span>
            <div class="song-actions">
              <button class="song-action-btn">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              </button>
              <button class="song-action-btn delete">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Song Card 2 -->
      <div class="song-card">
        <div class="song-cover">
          <span class="song-status done">已完成</span>
          <div class="cover-icon">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="song-info">
          <h3 class="song-title">夏日微风</h3>
          <p class="song-prompt">写一首关于夏天的轻快歌曲</p>
          <div class="song-meta">
            <span class="song-date">2024年5月8日</span>
            <div class="song-actions">
              <button class="song-action-btn">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              </button>
              <button class="song-action-btn delete">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Song Card 3 -->
      <div class="song-card">
        <div class="song-cover">
          <span class="song-status processing">制作中</span>
          <div class="cover-icon">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </div>
        </div>
        <div class="song-info">
          <h3 class="song-title">城市夜景</h3>
          <p class="song-prompt">创作一首关于城市夜晚的电子音乐</p>
          <div class="song-meta">
            <span class="song-date">2024年5月9日</span>
            <div class="song-actions">
              <button class="song-action-btn">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
              </button>
              <button class="song-action-btn delete">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Song Card 4 -->
      <div class="song-card">
        <div class="song-cover">
          <span class="song-status done">已完成</span>
          <div class="cover-icon">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="song-info">
          <h3 class="song-title">梦想启程</h3>
          <p class="song-prompt">一首励志的流行歌曲</p>
          <div class="song-meta">
            <span class="song-date">2024年5月7日</span>
            <div class="song-actions">
              <button class="song-action-btn">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              </button>
              <button class="song-action-btn delete">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Song Card 5 -->
      <div class="song-card">
        <div class="song-cover">
          <span class="song-status failed">失败</span>
          <div class="cover-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          </div>
        </div>
        <div class="song-info">
          <h3 class="song-title">深夜电台</h3>
          <p class="song-prompt">创作一首爵士风格的深夜歌曲</p>
          <div class="song-meta">
            <span class="song-date">2024年5月6日</span>
            <div class="song-actions">
              <button class="song-action-btn">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
              </button>
              <button class="song-action-btn delete">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
