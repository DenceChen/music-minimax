<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - Music MiniMax</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background */
    .bg-gradient {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 40%, rgba(120, 80, 200, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 80% 60%, rgba(60, 100, 200, 0.12), transparent),
        radial-gradient(ellipse 50% 30% at 50% 80%, rgba(160, 60, 180, 0.1), transparent);
      animation: gradientShift 12s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes gradientShift {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }

    /* Waveform decoration */
    .waveform {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 120px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      opacity: 0.15;
      pointer-events: none;
    }

    .waveform-bar {
      width: 3px;
      background: linear-gradient(to top, #8b5cf6, #3b82f6);
      border-radius: 2px;
      animation: wave 1.2s ease-in-out infinite;
    }

    @keyframes wave {
      0%, 100% { height: 20px; }
      50% { height: 60px; }
    }

    .login-card {
      position: relative;
      z-index: 10;
      width: 400px;
      padding: 48px 40px;
      background: rgba(20, 20, 28, 0.85);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); }
      50% { box-shadow: 0 0 0 12px rgba(139, 92, 246, 0); }
    }

    .logo-icon svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    .logo h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo p {
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 15, 22, 0.8);
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 12px;
      font-size: 15px;
      color: #e5e7eb;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .form-group input::placeholder {
      color: #4b5563;
    }

    .form-group input:focus {
      outline: none;
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }

    .btn-primary {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      margin-top: 8px;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 30px -5px rgba(139, 92, 246, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: #4b5563;
      font-size: 13px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    .divider span {
      padding: 0 16px;
    }

    .social-login {
      display: flex;
      gap: 12px;
    }

    .social-btn {
      flex: 1;
      padding: 12px;
      background: rgba(15, 15, 22, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #9ca3af;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
    }

    .social-btn:hover {
      background: rgba(30, 30, 42, 0.8);
      border-color: rgba(139, 92, 246, 0.3);
      color: #e5e7eb;
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
    }

    .footer-text {
      text-align: center;
      margin-top: 28px;
      font-size: 14px;
      color: #6b7280;
    }

    .footer-text a {
      color: #8b5cf6;
      text-decoration: none;
      font-weight: 500;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>

  <div class="waveform" id="waveform"></div>

  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
      </div>
      <h1>Music MiniMax</h1>
      <p>AI 驱动的音乐创作平台</p>
    </div>

    <form>
      <div class="form-group">
        <label for="email">邮箱地址</label>
        <input type="email" id="email" placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="输入密码">
      </div>

      <button type="submit" class="btn-primary">登 录</button>
    </form>

    <div class="divider"><span>或</span></div>

    <div class="social-login">
      <button class="social-btn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        邮箱登录
      </button>
    </div>

    <p class="footer-text">
      还没有账号？<a href="register-mockup.html">立即注册</a>
    </p>
  </div>

  <script>
    // Generate waveform bars
    const waveform = document.getElementById('waveform');
    for (let i = 0; i < 60; i++) {
      const bar = document.createElement('div');
      bar.className = 'waveform-bar';
      bar.style.animationDelay = (i * 0.05) + 's';
      bar.style.height = (15 + Math.random() * 45) + 'px';
      waveform.appendChild(bar);
    }
  </script>
</body>
</html>
